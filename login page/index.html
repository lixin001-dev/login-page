<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background: #f5f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    p {
      color: #888;
      font-size: 14px;
      margin-bottom: 32px;
    }

    input {
      width: 300px;
      height: 42px;
      margin-bottom: 16px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #007bff;
    }

    button {
      width: 300px;
      height: 45px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #0069d9;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Welcome Back</h1>
    <p>Sign in to continue</p >

    <input type="text" placeholder="Email">
    <br>

    <input type="password" placeholder="Password">
    <br>

    <button onclick="login()">Login</button>
  </div>

  <script>
    function login() {
      alert("登录按钮被点击了！");
    }
  </script>

</body>
</html>
